<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="snakelit-oauth-origin"
      content="https://snakemake-deploy-oauth.vercel.app"
    />
    <title>Deploy a Snakemake workflow</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.css"
    />
  </head>
  <body>
    <div id="root">
      <p style="font-family: sans-serif; padding: 2rem">
        Loading the in-browser Python runtime (the first load takes a while)…
      </p>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.js";

      // Set this to the deployed snakemake-deploy-oauth URL. The placeholder
      // keeps the OAuth component disabled until it is configured.
      const OAUTH_ORIGIN = document.querySelector(
        'meta[name="snakelit-oauth-origin"]',
      ).content;
      const OAUTH_CONFIGURED = !OAUTH_ORIGIN.includes("<");

      // Query parameters are passed as a mounted file instead of relying on
      // stlite's handling of the outer URL.
      const params = new URLSearchParams(window.location.search);
      const bootstrap = {
        repo: params.get("repo") || "",
        ref: params.get("ref") || "",
        oauth_origin: OAUTH_CONFIGURED ? OAUTH_ORIGIN : "",
        oauth_component: new URL(
          "oauth-component.html",
          window.location.href,
        ).toString(),
      };

      // The module list is generated by scripts/build.py; adding a file
      // under catalog_webapp/ does not require touching this page.
      const manifest = await (await fetch("./files.json")).json();
      const files = {};
      for (const path of manifest) {
        files[path] = { url: `./${path}` };
      }
      files["bootstrap.json"] = JSON.stringify(bootstrap);

      mount(
        {
          requirements: ["polars", "pyyaml", "jsonschema"],
          entrypoint: "app.py",
          files,
          streamlitConfig: {
            "client.toolbarMode": "viewer",
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
